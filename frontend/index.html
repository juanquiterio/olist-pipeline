<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Olist Analytics</title>
  <style>
:root {
  --bg: #0b0d10;
  --panel: #12161c;
  --panel-border: #1f2530;
  --panel-border-soft: #1a1f28;
  --text: #e7ebee;
  --muted: #838d99;
  --muted-dim: #596270;
  --accent: #37c98f;
  --tier-good: #37c98f;
  --tier-medium: #e0a940;
  --tier-poor: #e2574f;
  --radius: 10px;
  --radius-sm: 7px;
  --font-body: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
.stage { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }
.page-title { font-size: 22px; font-weight: 650; margin: 0 0 4px; }
.page-sub { font-size: 13px; color: var(--muted); margin: 0 0 28px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.tab {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  color: var(--muted);
  font-size: 12.5px;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.tab:hover { color: var(--text); border-color: var(--muted-dim); }
.tab.is-active {
  color: var(--accent);
  border-color: var(--accent);
  background: rgba(55, 201, 143, 0.08);
}
.view-title { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
.view-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
.loading, .error-msg { padding: 40px 0; text-align: center; font-size: 13px; color: var(--muted-dim); }
.error-msg { color: var(--tier-poor); }
.blist-row { padding: 12px 0; border-bottom: 1px solid var(--panel-border-soft); }
.blist-row:last-child { border-bottom: none; }
.blist-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.blist-label { font-size: 13px; font-weight: 600; color: var(--text); text-transform: capitalize; }
.blist-value { font-size: 13px; font-weight: 650; flex-shrink: 0; }
.tier-good { color: var(--tier-good); }
.tier-medium { color: var(--tier-medium); }
.tier-poor { color: var(--tier-poor); }
.blist-track { height: 6px; border-radius: 100px; background: var(--panel-border); overflow: hidden; }
.blist-fill { height: 100%; border-radius: 100px; }
.fill-good { background: var(--tier-good); }
.fill-medium { background: var(--tier-medium); }
.fill-poor { background: var(--tier-poor); }
.fill-neutral { background: var(--accent); }
.blist-caption { margin-top: 6px; font-size: 11.5px; color: var(--muted-dim); }
.show-more {
  margin-top: 14px;
  background: none;
  border: 1px dashed var(--panel-border);
  color: var(--muted);
  font-size: 12px;
  padding: 9px 14px;
  width: 100%;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.show-more:hover { color: var(--text); border-color: var(--muted-dim); }
.callout {
  background: rgba(224, 169, 64, 0.08);
  border: 1px solid rgba(224, 169, 64, 0.3);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.5;
  margin-top: 16px;
}
.callout b { color: var(--tier-medium); }
.linechart-wrap {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  padding: 18px 16px 10px;
}
.linechart-wrap svg { width: 100%; height: auto; display: block; }
.lc-axis-label { font-size: 9px; fill: var(--muted-dim); font-family: var(--font-body); }
.lc-point-label { font-size: 9.5px; fill: var(--text); font-family: var(--font-body); font-weight: 600; }
.table-toggle {
  margin-top: 18px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 12.5px;
  padding: 0;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--panel-border);
}
.table-toggle:hover { color: var(--text); }
.table-wrap {
  margin-top: 12px;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  overflow: auto;
  max-height: 360px;
}
table { border-collapse: collapse; width: 100%; font-size: 11.5px; font-family: var(--font-mono); }
th {
  position: sticky;
  top: 0;
  background: var(--panel);
  color: var(--muted-dim);
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--panel-border);
  white-space: nowrap;
  font-weight: 600;
}
td {
  padding: 7px 10px;
  color: var(--muted);
  border-bottom: 1px solid var(--panel-border-soft);
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
.card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  padding: 18px 20px 20px;
}
  </style>
</head>
<body>
  <main class="stage">
    <h1 class="page-title">Olist Analytics</h1>
    <p class="page-sub">E-commerce performance, from raw orders to business answers.</p>
    <nav class="tabs" id="tabs"></nav>
    <div id="content"></div>
  </main>

  <script>
// API_BASE:
//   - local development: http://localhost:8000
//   - production (Static Site on Render): the Web Service URL
const API_BASE = (["localhost", "127.0.0.1"].includes(location.hostname))
  ? "http://localhost:8000"
  : "https://olist-pipeline.onrender.com";

const TABS = [
  {
    id: "category-cancellations",
    label: "Cancellations by Category",
    title: "Which categories get canceled the most?",
    sub: "Ranked by cancellation rate. Color marks how a category compares to the rest of the catalog.",
  },
  {
    id: "delivery-vs-satisfaction",
    label: "Delay vs Satisfaction",
    title: "How does a late delivery affect the review score?",
    sub: "Average review score by delivery delay bucket, from earliest to latest.",
  },
  {
    id: "state-performance",
    label: "State Performance",
    title: "Which states have the worst delivery experience?",
    sub: "Ranked worst first, by average review score and late delivery rate.",
  },
  {
    id: "top-categories-revenue",
    label: "Revenue by Category",
    title: "Which categories drive the most revenue?",
    sub: "Top 20 categories by total revenue. Bar length shows share of total.",
  },
];

const el = {
  tabs: document.getElementById("tabs"),
  content: document.getElementById("content"),
};

const cache = {};
let activeTab = TABS[0].id;

const _fmt0 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const currencyFmt = (v) => _fmt0.format(v);
const _fmt2 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 2 });
const currencyFmt2 = (v) => _fmt2.format(v);

function buildTabs() {
  el.tabs.innerHTML = "";
  TABS.forEach((tab) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (tab.id === activeTab ? " is-active" : "");
    btn.textContent = tab.label;
    btn.addEventListener("click", () => selectTab(tab.id));
    el.tabs.append(btn);
  });
}

function selectTab(id) {
  activeTab = id;
  buildTabs();
  renderActiveTab();
}

async function renderActiveTab() {
  const tab = TABS.find((t) => t.id === activeTab);
  el.content.innerHTML = `
    <h2 class="view-title">${tab.title}</h2>
    <p class="view-sub">${tab.sub}</p>
    <div id="tab-body"><div class="loading">Loading...</div></div>
  `;

  try {
    const rows = await getData(tab.id);
    const body = document.getElementById("tab-body");
    body.innerHTML = "";
    RENDERERS[tab.id](body, rows);
  } catch (err) {
    console.error("Render error:", err);
    document.getElementById("tab-body").innerHTML =
      `<p class="error-msg">Couldn't load this data: ${err.message}</p>`;
  }
}

async function getData(tabId) {
  if (cache[tabId]) return cache[tabId];
  const res = await fetch(`${API_BASE}/${tabId}`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  cache[tabId] = data.rows;
  return data.rows;
}

function tierOf(rank, total, worsePosition) {
  const pct = rank / Math.max(1, total - 1);
  const p = worsePosition === "start" ? 1 - pct : pct;
  if (p < 1 / 3) return "good";
  if (p < 2 / 3) return "medium";
  return "poor";
}

function barRow({ label, valueLabel, tier, pct, caption }) {
  const row = document.createElement("div");
  row.className = "blist-row";
  row.innerHTML = `
    <div class="blist-top">
      <span class="blist-label">${label}</span>
      <span class="blist-value ${tier ? "tier-" + tier : ""}">${valueLabel}</span>
    </div>
    <div class="blist-track"><div class="blist-fill ${tier ? "fill-" + tier : "fill-neutral"}" style="width:${Math.max(2, pct)}%"></div></div>
    ${caption ? `<div class="blist-caption">${caption}</div>` : ""}
  `;
  return row;
}

function buildShowMore(container, allRows, visibleCount, buildRow) {
  let shown = visibleCount;
  const list = document.createElement("div");
  container.append(list);

  function paint() {
    list.innerHTML = "";
    allRows.slice(0, shown).forEach((r) => list.append(buildRow(r)));
  }
  paint();

  if (allRows.length > visibleCount) {
    const btn = document.createElement("button");
    btn.className = "show-more";
    btn.textContent = `Show all ${allRows.length} rows`;
    btn.addEventListener("click", () => {
      shown = allRows.length;
      paint();
      btn.remove();
    });
    container.append(btn);
  }
}

function buildTableToggle(container, rows, columns) {
  const toggle = document.createElement("button");
  toggle.className = "table-toggle";
  toggle.textContent = "Show full data table";
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  wrap.hidden = true;

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  thead.innerHTML = `<tr>${columns.map((c) => `<th>${c.label}</th>`).join("")}</tr>`;
  const tbody = document.createElement("tbody");
  rows.forEach((row) => {
    const tr = document.createElement("tr");
    tr.innerHTML = columns.map((c) => `<td>${c.format ? c.format(row[c.key]) : row[c.key]}</td>`).join("");
    tbody.append(tr);
  });
  table.append(thead, tbody);
  wrap.append(table);

  toggle.addEventListener("click", () => {
    wrap.hidden = !wrap.hidden;
    toggle.textContent = wrap.hidden ? "Show full data table" : "Hide full data table";
  });

  container.append(toggle, wrap);
}

const RENDERERS = {
  "category-cancellations": renderCancellations,
  "delivery-vs-satisfaction": renderDelivery,
  "state-performance": renderStates,
  "top-categories-revenue": renderRevenue,
};

function renderCancellations(container, rows) {
  const card = document.createElement("div");
  card.className = "card";
  const maxRate = Math.max(...rows.map((r) => r.cancellation_rate_pct));
  buildShowMore(card, rows, 10, (row) => {
    const rank = rows.indexOf(row);
    const tier = tierOf(rank, rows.length, "start");
    return barRow({
      label: row.category_name_en.replace(/_/g, " "),
      valueLabel: `${row.cancellation_rate_pct}%`,
      tier,
      pct: (row.cancellation_rate_pct / maxRate) * 100,
      caption: `${row.total_orders} orders · avg review ${row.avg_review_score ?? "—"} · ${row.late_delivery_rate_pct}% late`,
    });
  });
  container.append(card);
  buildTableToggle(container, rows, [
    { key: "category_name_en", label: "Category" },
    { key: "total_orders", label: "Orders" },
    { key: "canceled_orders", label: "Canceled" },
    { key: "cancellation_rate_pct", label: "Cancel %", format: (v) => `${v}%` },
    { key: "late_delivery_rate_pct", label: "Late %", format: (v) => `${v}%` },
    { key: "avg_delivery_days", label: "Avg delivery (d)" },
    { key: "avg_review_score", label: "Avg review" },
    { key: "total_revenue", label: "Revenue", format: (v) => currencyFmt(v) },
  ]);
}

function renderDelivery(container, rows) {
  const w = 680, h = 230, padL = 36, padR = 16, padT = 20, padB = 34;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = rows.length;
  const xFor = (i) => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const yFor = (score) => padT + plotH - (score / 5) * plotH;

  let cliffIdx = -1, cliffDrop = 0;
  for (let i = 1; i < n; i++) {
    const drop = rows[i - 1].avg_review_score - rows[i].avg_review_score;
    if (drop > cliffDrop) { cliffDrop = drop; cliffIdx = i; }
  }

  const points = rows.map((r, i) => `${xFor(i)},${yFor(r.avg_review_score)}`).join(" ");

  const gridLines = [0, 1, 2, 3, 4, 5].map((v) => {
    const y = yFor(v);
    return `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="var(--panel-border-soft)" stroke-width="1" />
            <text x="${padL - 8}" y="${y + 3}" text-anchor="end" class="lc-axis-label">${v}</text>`;
  }).join("");

  const xLabels = rows.map((r, i) =>
    `<text x="${xFor(i)}" y="${h - padB + 16}" text-anchor="middle" class="lc-axis-label">${r.delay_bucket}</text>`
  ).join("");

  const dots = rows.map((r, i) => {
    const x = xFor(i), y = yFor(r.avg_review_score);
    const isCliff = i === cliffIdx;
    return `
      <circle cx="${x}" cy="${y}" r="${isCliff ? 5 : 3.5}" fill="${isCliff ? "var(--tier-poor)" : "var(--accent)"}" />
      <text x="${x}" y="${y - 10}" text-anchor="middle" class="lc-point-label">${r.avg_review_score}</text>
    `;
  }).join("");

  const wrap = document.createElement("div");
  wrap.className = "linechart-wrap";
  wrap.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      ${gridLines}
      <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2" />
      ${dots}
      ${xLabels}
    </svg>
  `;
  container.append(wrap);

  if (cliffIdx > -1 && cliffDrop > 0.15) {
    const from = rows[cliffIdx - 1], to = rows[cliffIdx];
    const callout = document.createElement("div");
    callout.className = "callout";
    callout.innerHTML =
      `<b>Satisfaction drops sharply</b> between "${from.delay_bucket}" and "${to.delay_bucket}" — ` +
      `average review score falls from ${from.avg_review_score} to ${to.avg_review_score} ` +
      `(${to.pct_bad_reviews}% of orders in that bucket get a bad review).`;
    container.append(callout);
  }

  buildTableToggle(container, rows, [
    { key: "delay_bucket", label: "Delay bucket" },
    { key: "total_orders", label: "Orders" },
    { key: "avg_review_score", label: "Avg review" },
    { key: "avg_delivery_days", label: "Avg delivery (d)" },
    { key: "pct_bad_reviews", label: "Bad reviews %", format: (v) => `${v}%` },
  ]);
}

function renderStates(container, rows) {
  const card = document.createElement("div");
  card.className = "card";
  const maxLate = Math.max(...rows.map((r) => r.late_delivery_rate_pct));
  buildShowMore(card, rows, 10, (row) => {
    const rank = rows.indexOf(row);
    const tier = tierOf(rank, rows.length, "start");
    return barRow({
      label: row.customer_state,
      valueLabel: `★ ${row.avg_review_score}`,
      tier,
      pct: maxLate > 0 ? (row.late_delivery_rate_pct / maxLate) * 100 : 0,
      caption: `${row.total_orders} orders · ${row.late_delivery_rate_pct}% late · ${row.cancellation_rate_pct}% canceled · avg order ${currencyFmt2(row.avg_order_value)}`,
    });
  });
  container.append(card);
  buildTableToggle(container, rows, [
    { key: "customer_state", label: "State" },
    { key: "total_orders", label: "Orders" },
    { key: "cancellation_rate_pct", label: "Cancel %", format: (v) => `${v}%` },
    { key: "late_delivery_rate_pct", label: "Late %", format: (v) => `${v}%` },
    { key: "avg_delivery_days", label: "Avg delivery (d)" },
    { key: "avg_review_score", label: "Avg review" },
    { key: "avg_order_value", label: "Avg order value", format: (v) => currencyFmt2(v) },
  ]);
}

function renderRevenue(container, rows) {
  const card = document.createElement("div");
  card.className = "card";
  const maxPct = Math.max(...rows.map((r) => r.pct_of_total_revenue));
  buildShowMore(card, rows, 20, (row) => {
    const highFreight = row.freight_to_price_pct >= 25;
    return barRow({
      label: row.category_name_en.replace(/_/g, " "),
      valueLabel: currencyFmt(row.total_revenue),
      tier: null,
      pct: (row.pct_of_total_revenue / maxPct) * 100,
      caption: `${row.pct_of_total_revenue}% of total revenue · avg item ${currencyFmt2(row.avg_item_price)}` +
        (highFreight ? ` · <span class="tier-medium">high freight ratio (${row.freight_to_price_pct}%)</span>` : ""),
    });
  });
  container.append(card);
  buildTableToggle(container, rows, [
    { key: "category_name_en", label: "Category" },
    { key: "total_items", label: "Items" },
    { key: "total_orders", label: "Orders" },
    { key: "total_revenue", label: "Revenue", format: (v) => currencyFmt(v) },
    { key: "avg_item_price", label: "Avg item price", format: (v) => currencyFmt2(v) },
    { key: "avg_freight", label: "Avg freight", format: (v) => currencyFmt2(v) },
    { key: "freight_to_price_pct", label: "Freight/price %", format: (v) => `${v}%` },
    { key: "pct_of_total_revenue", label: "% of total", format: (v) => `${v}%` },
  ]);
}

buildTabs();
renderActiveTab();
  </script>
</body>
</html>
